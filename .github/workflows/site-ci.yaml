name: Site CI
on:
  pull_request:
    branches: [v5]
  push:
    branches: [v5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    name: Site CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install-plugins
      - run: npx tsc --noEmit
      - run: npm test
      - run: node quartz/bootstrap-cli.mjs build --concurrency=1
